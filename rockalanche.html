<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROCKALANCHE — Rockerizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--purple:#4B00A8;--pink:#FF008C;--yellow:#FFC31A;--orange:#FF6A00;--ink:#0D0D0D;--white:#FFF;--cyan:#00E5FF;
  --bd:4px solid var(--ink);--sh:6px 6px 0 var(--ink);--disp:"Anton",sans-serif;--chunk:"Bungee",sans-serif;--script:"Permanent Marker",cursive;--body:"Poppins",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow:hidden;height:100%}
body{background:var(--yellow);color:var(--ink);font-family:var(--body);font-weight:600;
  background-image:radial-gradient(var(--ink) 1.4px,transparent 1.4px);background-size:24px 24px;
  display:flex;flex-direction:column;align-items:stretch;height:100vh;height:100dvh;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
.rocknav{position:sticky;top:0;z-index:600;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;background:var(--purple);border-bottom:3px solid var(--ink);flex:none}
.rocknav .brand{display:flex;align-items:center;gap:6px;text-decoration:none}
.rocknav .brand img{height:18px}
.rocknav .links{display:flex;gap:5px}
.rocknav a.lnk{font-family:var(--chunk);font-size:11px;color:var(--white);text-decoration:none;border:2px solid transparent;padding:6px 11px;border-radius:100px;white-space:nowrap}
.rocknav a.lnk:hover{background:rgba(255,255,255,.16)}
.rocknav a.lnk.active{background:var(--yellow);color:var(--ink)}
@media(max-width:360px){.rocknav a.lnk{font-size:10px;padding:5px 8px}.rocknav .links{gap:4px}}
.game{flex:1;min-height:0;width:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:6px 10px 8px}
.brandbar{display:flex;align-items:center;justify-content:center;gap:8px}
.brandbar img{height:24px;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.4))}
.present{font-family:var(--chunk);font-size:9px;color:var(--purple);letter-spacing:.05em}
.title h1{font-family:var(--disp);font-size:clamp(26px,8vw,44px);line-height:.82;color:var(--cyan);-webkit-text-stroke:3px var(--ink);text-shadow:4px 4px 0 var(--pink);paint-order:stroke fill;text-align:center}
.title .tag{font-family:var(--script);font-size:clamp(12px,3.6vw,17px);color:var(--ink);text-align:center;margin-top:-2px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--white);border:var(--bd);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:6px 4px;text-align:center}
.stat .k{font-family:var(--chunk);font-size:9px;color:var(--purple)}
.stat .v{font-family:var(--disp);font-size:22px;line-height:1;margin-top:1px}
.stat.best .v{color:var(--orange)}
.stagewrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;border:var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh);background:#160a2e}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none}
.over{position:absolute;inset:0;background:rgba(13,13,13,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;z-index:5}
.over.show{display:flex}
.over h2{font-family:var(--disp);font-size:38px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
.over .big{font-family:var(--disp);font-size:60px;color:var(--cyan);line-height:.9}
.over .lbl{font-family:var(--chunk);font-size:12px;color:var(--white)}
.over .nb{font-family:var(--chunk);font-size:14px;color:var(--pink);min-height:16px}
.over button{margin-top:8px;font-family:var(--chunk);font-size:20px;color:var(--ink);background:var(--yellow);border:var(--bd);border-radius:100px;padding:13px 26px;box-shadow:var(--sh);cursor:pointer}
.over button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.row2{display:flex;gap:10px;align-items:center}
.hint{flex:1;text-align:center;font-size:12px;color:var(--purple);font-weight:700}
.snd{min-width:52px;padding:0 13px;font-family:var(--chunk);font-size:13px;background:var(--cyan);border:var(--bd);border-radius:100px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;height:40px;display:grid;place-items:center}
.snd.off{background:#9fb6b9;color:#3a4a4c}
.home{text-align:center}
.home a{font-family:var(--chunk);font-size:11px;color:var(--ink);text-decoration:none;opacity:.6}
</style>
</head>

  <div class="links"><a class="lnk" href="index.html">HOME</a><a class="lnk active" href="rockalanche.html">PLAY</a><a class="lnk" href="how-we-built-it.html">MADE</a></div>
</nav>
<div class="game">
  <div class="title"><h1>ROCKALANCHE</h1><div class="tag">match 3, crumble the wall!</div></div>
  <div class="hud">
    <div class="stat"><div class="k">SCORE</div><div class="v" id="score">0</div></div>
    <div class="stat best"><div class="k">BEST</div><div class="v" id="best">0</div></div>
    <div class="stat"><div class="k">LEVEL</div><div class="v" id="level">1</div></div>
  </div>
  <div class="stagewrap">
    <canvas id="c"></canvas>
    <audio id="music" loop></audio>
    <div class="over" id="over">
      <h2 id="overTitle">WALL WINS!</h2>
      <div class="lbl">YOU SCORED</div>
      <div class="big" id="finalScore">0</div>
      <div class="nb" id="newbest"></div>
      <button id="again">ROCK AGAIN</button>
    </div>
  </div>
  <div class="row2">
    <div class="hint">Drag to aim &#183; bank off the walls &#183; release to fire</div>
    <button class="snd" id="musBtn" aria-label="music">SONG</button>
    <button class="snd" id="sndBtn" aria-label="sound">SFX</button>
  </div>
</div>

var COLORS=['r0','r1','r2','r3','r4'];

var grid=[],topParity=0;
function par(r){return (r+topParity)&1;}
function cellX(r,c){return pad+R+(par(r)?spacing/2:0)+c*spacing;}
function cellY(r){return originY+r*rowH;}
function ensureRow(r){ while(grid.length<=r) grid.push(new Array(COLS).fill(null)); }
function neighbors(r,c){
  var odd=par(r),l=[[r,c-1],[r,c+1]];
  if(odd){l.push([r-1,c],[r-1,c+1],[r+1,c],[r+1,c+1]);} else {l.push([r-1,c-1],[r-1,c],[r+1,c-1],[r+1,c]);}
  return l.filter(function(p){return p[0]>=0&&p[0]<grid.length&&p[1]>=0&&p[1]<COLS;});
}

var score=0,best=0,level=1,ball=null,cur=null,next=null,gameOver=false,shotsSinceRow=0,rowEvery=6;
var aimAng=-Math.PI/2,aiming=false,recoil=0,shake=0;
var pops=[],falls=[],chips=[];
var $=function(i){return document.getElementById(i);};
try{best=parseInt(localStorage.getItem('rockalanche_best')||'0',10)||0;}catch(e){best=0;}
$('best').textContent=best;

/* audio */
var actx=null,soundOn=true,lastTok=0;
var SFX={},_sfxLoaded=false;
function ensureAudio(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();if(actx&&!_sfxLoaded){_sfxLoaded=true;loadSFX();}}
function b64buf(b){var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
function loadSFX(){for(var k in SFXSRC){(function(key){try{actx.decodeAudioData(b64buf(SFXSRC[key]),function(buf){SFX[key]=buf;});}catch(e){}})(k);}}
function snd(buf,rate,gain,when){if(!soundOn||!actx||!buf)return;var s=actx.createBufferSource();s.buffer=buf;s.playbackRate.value=rate||1;var g=actx.createGain();g.gain.value=gain||0.6;s.connect(g);g.connect(actx.destination);try{s.start(actx.currentTime+(when||0));}catch(e){}}
function sfxShoot(){SFX.clack?snd(SFX.clack,1.35+Math.random()*0.2,0.3):blip(680,0.08,'square',0.12);}
function sfxAttach(){var b=Math.random()<0.5?SFX.clack:SFX.clack2;b?snd(b,0.9+Math.random()*0.28,0.5):blip(300,0.05,'square',0.08);}
function sfxCrumble(sz){SFX.burst?snd(SFX.burst,Math.max(0.7,1.18-sz*0.05),Math.min(0.9,0.45+sz*0.05)):crumble(sz);}
function sfxDrop(n){if(SFX.burst){snd(SFX.burst,0.8,0.6);snd(SFX.burst,0.62,0.5,0.12);if(n>4&&SFX.clack)snd(SFX.clack,0.7,0.4,0.22);}else{blip(520,0.2,'triangle',0.13);}}
function sfxRumble(){SFX.burst?snd(SFX.burst,0.5,0.45):blip(160,0.2,'sawtooth',0.1);}
function sfxLevel(){if(SFX.clack){snd(SFX.clack,1.1,0.4);snd(SFX.clack,1.3,0.4,0.08);snd(SFX.clack,1.55,0.45,0.16);}else{blip(523,0.18,'triangle',0.14);}}
function sfxOver(){if(SFX.burst){snd(SFX.burst,0.55,0.6);snd(SFX.burst,0.42,0.5,0.18);}else{blip(220,0.3,'sawtooth',0.12);}}
function blip(f,d,t,v){if(!soundOn||!actx)return;var o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(actx.destination);var n=actx.currentTime;g.gain.setValueAtTime(0.0001,n);g.gain.exponentialRampToValueAtTime(v||0.12,n+0.004);g.gain.exponentialRampToValueAtTime(0.0001,n+(d||0.12));o.start(n);o.stop(n+(d||0.12)+0.03);}
function crumble(sz){if(!soundOn||!actx)return;var len=Math.floor(actx.sampleRate*0.18);var b=actx.createBuffer(1,len,actx.sampleRate),dd=b.getChannelData(0);for(var i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);var s=actx.createBufferSource();s.buffer=b;var f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=400+sz*120;f.Q.value=0.7;var g=actx.createGain();g.gain.value=0.5;s.connect(f);f.connect(g);g.connect(actx.destination);s.start();}
function buzz(m){if(navigator.vibrate){try{navigator.vibrate(m);}catch(e){}}}

/* board */
function colorsOnBoard(){var s={};for(var r=0;r<grid.length;r++)for(var c=0;c<COLS;c++)if(grid[r][c])s[grid[r][c]]=1;var a=Object.keys(s);return a.length?a:COLORS.slice();}
function pickColor(){var a=colorsOnBoard();return a[(Math.random()*a.length)|0];}
function newWall(rows){
  grid=[];topParity=0;
  for(var r=0;r<rows;r++){var row=new Array(COLS).fill(null);for(var c=0;c<COLS;c++){ if(r<rows-1||Math.random()<0.7) row[c]=COLORS[(Math.random()*COLORS.length)|0]; }grid.push(row);}
}
function start(){
  score=0;level=1;gameOver=false;shotsSinceRow=0;rowEvery=6;ball=null;pops=[];falls=[];chips=[];
  newWall(5);cur=pickColor();next=pickColor();
  $('score').textContent=0;$('level').textContent=1;$('over').classList.remove('show');
}

/* shooting */
function fire(){
  if(ball||gameOver)return; ensureAudio();
  ball={x:shooterX,y:shooterY,vx:Math.cos(aimAng)*620,vy:Math.sin(aimAng)*620,color:cur};
  cur=next;next=pickColor();recoil=10;sfxShoot();buzz(8);
}
function snapCell(x,y){
  var best=null,bd=1e9,r0=Math.round((y-originY)/rowH); if(r0<0)r0=0; ensureRow(r0+1);
  for(var r=Math.max(0,r0-1);r<=r0+1;r++){ if(!grid[r])continue;
    for(var c=0;c<COLS;c++){ if(grid[r][c])continue; var dx=cellX(r,c)-x,dy=cellY(r)-y,d=dx*dx+dy*dy; if(d<bd){bd=d;best={r:r,c:c};} } }
  if(!best){ for(var r2=0;r2<grid.length;r2++)for(var c2=0;c2<COLS;c2++){ if(grid[r2][c2])continue; var dx2=cellX(r2,c2)-x,dy2=cellY(r2)-y,d2=dx2*dx2+dy2*dy2; if(d2<bd){bd=d2;best={r:r2,c:c2};} } }
  return best;
}
function place(){
  var cell=snapCell(ball.x,ball.y); var col=ball.color; ball=null;
  if(!cell){ afterShot(); return; }
  ensureRow(cell.r); grid[cell.r][cell.c]=col;
  sfxAttach();
  var clu=cluster(cell.r,cell.c,col);
  if(clu.length>=3){
    for(var i=0;i<clu.length;i++){var p=clu[i];grid[p[0]][p[1]]=null;pops.push({x:cellX(p[0],p[1]),y:cellY(p[0]),color:col,age:0});}
    score+=clu.length*10+(clu.length-3)*5;
    sfxCrumble(clu.length);buzz(clu.length>5?[15,30,20]:14);shake=Math.min(12,clu.length*1.4);
    dropFloating(col);
  } else { buzz(4); }
  $('score').textContent=score;
  afterShot();
}
function cluster(r,c,col){
  var seen={},st=[[r,c]],out=[];
  while(st.length){var p=st.pop(),k=p[0]+','+p[1];if(seen[k])continue;seen[k]=1;if(!grid[p[0]]||grid[p[0]][p[1]]!==col)continue;out.push(p);var nb=neighbors(p[0],p[1]);for(var i=0;i<nb.length;i++)st.push(nb[i]);}
  return out;
}
function dropFloating(col){
  var seen={},st=[];
  for(var c=0;c<COLS;c++){ if(grid[0]&&grid[0][c]){st.push([0,c]);} }
  while(st.length){var p=st.pop(),k=p[0]+','+p[1];if(seen[k])continue;if(!grid[p[0]]||!grid[p[0]][p[1]])continue;seen[k]=1;var nb=neighbors(p[0],p[1]);for(var i=0;i<nb.length;i++)st.push(nb[i]);}
  var dropped=0;
  for(var r=0;r<grid.length;r++)for(var c2=0;c2<COLS;c2++){ if(grid[r][c2] && !seen[r+','+c2]){ falls.push({x:cellX(r,c2),y:cellY(r),vx:(Math.random()*60-30),vy:-40-Math.random()*60,color:grid[r][c2],age:0}); grid[r][c2]=null; dropped++; } }
  if(dropped){ score+=dropped*20; $('score').textContent=score; sfxDrop(dropped); shake=Math.min(16,shake+dropped); }
}
function addRow(){
  grid.unshift(new Array(COLS).fill(null).map(function(){return Math.random()<0.85?COLORS[(Math.random()*COLORS.length)|0]:null;}));
  topParity^=1; shotsSinceRow=0; sfxRumble();
}
function afterShot(){
  shotsSinceRow++; if(shotsSinceRow>=rowEvery) addRow();
  var empty=true; for(var r=0;r<grid.length&&empty;r++)for(var c=0;c<COLS;c++)if(grid[r][c]){empty=false;break;}
  if(empty){ level++; $('level').textContent=level; score+=200; $('score').textContent=score; rowEvery=Math.max(3,6-Math.floor(level/2)); newWall(5); cur=pickColor(); next=pickColor(); sfxLevel(); return; }
  for(var r2=0;r2<grid.length;r2++)for(var c2=0;c2<COLS;c2++){ if(grid[r2][c2] && cellY(r2)+R>=dangerY){ endGame(); return; } }
}
function endGame(){
  gameOver=true;$('finalScore').textContent=score;
  var nb='';if(score>best){best=score;try{localStorage.setItem('rockalanche_best',String(best));}catch(e){}nb='&#9889; NEW BEST! &#9889;';}
  $('best').textContent=best;$('newbest').innerHTML=nb;$('over').classList.add('show');
  if(soundOn&&actx){sfxOver();}
}

/* physics */
function update(dt){
  if(recoil>0)recoil-=dt*60; if(shake>0.3)shake*=0.86;else shake=0;
  for(var i=falls.length-1;i>=0;i--){var f=falls[i];f.vy+=1500*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.age+=dt;if(f.y>H+30)falls.splice(i,1);}
  for(var p=pops.length-1;p>=0;p--){pops[p].age+=dt;if(pops[p].age>0.4)pops.splice(p,1);}
  for(var c=chips.length-1;c>=0;c--){var ch=chips[c];ch.vy+=1400*dt;ch.x+=ch.vx*dt;ch.y+=ch.vy*dt;ch.age+=dt;if(ch.age>0.7)chips.splice(c,1);}
  if(!ball)return;
  var rem=dt,maxStep=R*0.5;
  while(rem>0){
    var sp=Math.hypot(ball.vx,ball.vy),st=Math.min(rem,maxStep/(sp||1));
    ball.x+=ball.vx*st;ball.y+=ball.vy*st;rem-=st;
    if(ball.x<pad+R){ball.x=pad+R;ball.vx=Math.abs(ball.vx);}
    if(ball.x>W-pad-R){ball.x=W-pad-R;ball.vx=-Math.abs(ball.vx);}
    if(ball.y<=originY){place();return;}
    var hit=false,r0=Math.round((ball.y-originY)/rowH);
    for(var r=Math.max(0,r0-1);r<=Math.min(grid.length-1,r0+1)&&!hit;r++){ if(!grid[r])continue;
      for(var cc=0;cc<COLS;cc++){ if(!grid[r][cc])continue; var dx=cellX(r,cc)-ball.x,dy=cellY(r)-ball.y; if(dx*dx+dy*dy<(2*R*0.86)*(2*R*0.86)){hit=true;break;} } }
    if(hit){place();return;}
  }
}

/* trajectory preview */
function trace(){
  var pts=[],x=shooterX,y=shooterY,dx=Math.cos(aimAng),dy=Math.sin(aimAng),b=0,n=0;
  while(n<260){ x+=dx*7;y+=dy*7;n++;
    if(x<pad+R){x=pad+R;dx=-dx;b++;} if(x>W-pad-R){x=W-pad-R;dx=-dx;b++;}
    if(y<=originY){pts.push([x,y]);break;}
    var stop=false,r0=Math.round((y-originY)/rowH);
    for(var r=Math.max(0,r0-1);r<=Math.min(grid.length-1,r0+1)&&!stop;r++){ if(!grid[r])continue;
      for(var c=0;c<COLS;c++){ if(!grid[r][c])continue; var ddx=cellX(r,c)-x,ddy=cellY(r)-y; if(ddx*ddx+ddy*ddy<(2*R*0.9)*(2*R*0.9)){stop=true;break;} } }
    if(stop||b>3)break; if(n%3===0)pts.push([x,y]);
  }
  return pts;
}

/* render */
function rock(x,y,rad,color){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle=color;ctx.strokeStyle='#0D0D0D';ctx.lineWidth=2.4;
  ctx.beginPath();
  ctx.moveTo(-rad*0.7,rad*0.4);ctx.quadraticCurveTo(-rad,-rad*0.2,-rad*0.3,-rad*0.72);
  ctx.quadraticCurveTo(rad*0.3,-rad,rad*0.8,-rad*0.3);ctx.quadraticCurveTo(rad,rad*0.5,rad*0.3,rad*0.75);
  ctx.quadraticCurveTo(-rad*0.3,rad,-rad*0.7,rad*0.4);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.ellipse(-rad*0.26,-rad*0.28,rad*0.3,rad*0.18,-0.5,0,7);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.arc(rad*0.2,rad*0.2,rad*0.13,0,7);ctx.fill();
  ctx.restore();
}
function draw(){
  ctx.save();
  if(shake>0.3)ctx.translate((Math.random()*2-1)*shake,(Math.random()*2-1)*shake);
  var _bg=BGIMG.length?BGIMG[(level-1)%BGIMG.length]:null;
  if(_bg&&_bg.complete&&_bg.naturalWidth){var _s=Math.max(W/_bg.naturalWidth,H/_bg.naturalHeight)*1.05,_dw=_bg.naturalWidth*_s,_dh=_bg.naturalHeight*_s;ctx.drawImage(_bg,(W-_dw)/2,(H-_dh)/2,_dw,_dh);ctx.fillStyle='rgba(13,6,30,0.5)';ctx.fillRect(-20,-20,W+40,H+40);var _gd=ctx.createLinearGradient(0,0,0,H);_gd.addColorStop(0,'rgba(10,4,24,0.45)');_gd.addColorStop(0.55,'rgba(10,4,24,0.10)');_gd.addColorStop(1,'rgba(10,4,24,0.42)');ctx.fillStyle=_gd;ctx.fillRect(-20,-20,W+40,H+40);}else{ctx.fillStyle='#160a2e';ctx.fillRect(-20,-20,W+40,H+40);}
  /* danger line */
  ctx.strokeStyle='rgba(255,0,140,.5)';ctx.lineWidth=2;ctx.setLineDash([6,6]);
  ctx.beginPath();ctx.moveTo(0,dangerY);ctx.lineTo(W,dangerY);ctx.stroke();ctx.setLineDash([]);
  /* grid rocks */
  for(var r=0;r<grid.length;r++)for(var c=0;c<COLS;c++){ if(grid[r][c]) rock(cellX(r,c),cellY(r),R-1.5,grid[r][c]); }
  /* falls + chips + pops */
  for(var i=0;i<falls.length;i++){var f=falls[i];ctx.globalAlpha=Math.max(0,1-f.age/1.2);rock(f.x,f.y,R-2,f.color);ctx.globalAlpha=1;}
  for(var p=0;p<pops.length;p++){var po=pops[p],a=po.age/0.4;ctx.globalAlpha=Math.max(0,1-a);rock(po.x,po.y,(R-1.5)*(1+a*0.6),po.color);ctx.globalAlpha=1;}
  for(var ci=0;ci<chips.length;ci++){rock(chips[ci].x,chips[ci].y,3,chips[ci].color);}
  /* aim preview */
  if(!ball&&!gameOver){ var pts=trace(); ctx.fillStyle='rgba(255,255,255,.55)'; for(var t=0;t<pts.length;t++){ctx.beginPath();ctx.arc(pts[t][0],pts[t][1],2.4,0,7);ctx.fill();} }
  /* ball */
  if(ball) rock(ball.x,ball.y,R-1.5,ball.color);
  /* shooter */
  var sy=shooterY+recoil*0.4;
  ctx.save();ctx.translate(shooterX,sy);
  ctx.fillStyle='#3a2a66';ctx.strokeStyle='#0D0D0D';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(0,0,R+8,0,Math.PI,true);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
  if(!gameOver){ rock(shooterX,sy,R-1.5,cur); }
  /* next preview */
  if(!gameOver){ rock(W-22,shooterY+2,R*0.6,next); ctx.fillStyle='#fff';ctx.font='700 8px Bungee';ctx.textAlign='center';ctx.fillText('NEXT',W-22,shooterY-R*0.7); }
  ctx.restore();
}

var ROCKIMG={};for(var _k in ROCKSRC){(function(key){var im=new Image();im.src=ROCKSRC[key];ROCKIMG[key]=im;})(_k);}
function rock(x,y,rad,color){var im=ROCKIMG[color];var s=rad*2.42;if(im&&im.complete&&im.naturalWidth){ctx.drawImage(im,x-s/2,y-s/2,s,s);}else{ctx.save();ctx.fillStyle='#8a8a8a';ctx.strokeStyle='#0D0D0D';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,rad,0,7);ctx.fill();ctx.stroke();ctx.restore();}}
var last=performance.now();
function frame(now){var dt=Math.min(0.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame);}
requestAnimationFrame(frame);

/* input: drag to aim, release to fire */
function setAim(cx,cy){
  var rect=cv.getBoundingClientRect(),x=(cx-rect.left)/rect.width*W,y=(cy-rect.top)/rect.height*H;
  var a=Math.atan2(y-shooterY,x-shooterX); var minA=-(Math.PI-0.32),maxA=-0.32;
  if(a>0)a=(x<shooterX)?minA:maxA; a=Math.max(minA,Math.min(maxA,a)); aimAng=a;
}
cv.addEventListener('pointerdown',function(e){ if(gameOver)return; aiming=true; setAim(e.clientX,e.clientY); ensureAudio(); ensureMusic(); });
cv.addEventListener('pointermove',function(e){ if(aiming&&!gameOver) setAim(e.clientX,e.clientY); });
cv.addEventListener('pointerup',function(e){ if(aiming&&!gameOver){ setAim(e.clientX,e.clientY); fire(); } aiming=false; });
cv.addEventListener('pointercancel',function(){ aiming=false; });
$('again').addEventListener('click',start);
$('sndBtn').addEventListener('click',function(){soundOn=!soundOn;ensureAudio();this.classList.toggle('off',!soundOn);});
$('musBtn').addEventListener('click',function(){musicOn=!musicOn;this.classList.toggle('off',!musicOn);if(musicOn){ensureMusic();}else if(musicEl){musicEl.pause();}});

start();
</script>
